# ==============================================================================
# Render Unified Service Blueprint: render.yaml (Docker-based)
# Single Web Service serving both React Frontend and Spring Boot Backend
# Connected to external Neon Serverless PostgreSQL
# ==============================================================================

services:
  - type: web
    name: fintrack
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DEVELOPMENT_MODE
        value: "false"
      # Neon PostgreSQL JDBC Connection details (SPRING_DATASOURCE_* or POSTGRES_*)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GENERIC_WEBHOOK_SECRET
        sync: false
