# ==============================================================================
# Render Infrastructure as Code Blueprint: render.yaml (with Neon Serverless PostgreSQL)
# 1. Native Spring Boot Java Web Service (connected to external Neon DB)
# 2. Native React + Vite Static Site
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend: Spring Boot Java Web Service (Native Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: fintrack-backend
    runtime: java
    region: singapore
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/fintrack-backend-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DEVELOPMENT_MODE
        value: "false"
      # Paste your Neon or Cloud PostgreSQL connection details in Render Dashboard
      - key: POSTGRES_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GENERIC_WEBHOOK_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend: React + Vite Static Site (Native Node.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: fintrack-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Proxy API requests to backend
      - type: rewrite
        source: /api/*
        destination: https://fintrack-backend.onrender.com/api/*
      # Proxy Actuator health to backend
      - type: rewrite
        source: /actuator/health
        destination: https://fintrack-backend.onrender.com/actuator/health
      # SPA fallback routing
      - type: rewrite
        source: /*
        destination: /index.html
