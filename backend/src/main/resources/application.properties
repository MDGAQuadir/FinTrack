server.port=${PORT:8080}

# PostgreSQL Database Configuration (Supports SPRING_DATASOURCE_*, POSTGRES_*, DATABASE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/fintrack}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Flyway owns schema, Hibernate validates)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
fintrack.jwt.secret=${JWT_SECRET:fintrack-super-secure-jwt-secret-key-for-token-generation-2026}
fintrack.jwt.expiration=604800000

# App Settings
fintrack.development-mode=${DEVELOPMENT_MODE:true}
fintrack.support.email=${SUPPORT_EMAIL:support@fintrack.app}

# Mail Configuration (Supports SPRING_MAIL_*, MAIL_*, SMTP_*)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USER:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASS:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Payment Webhook Secrets
fintrack.webhook.secret.razorpay=${RAZORPAY_WEBHOOK_SECRET:razorpay_secret_key_demo_2026}
fintrack.webhook.secret.stripe=${STRIPE_WEBHOOK_SECRET:whsec_stripe_secret_demo_2026}
fintrack.webhook.secret.generic=${GENERIC_WEBHOOK_SECRET:fintrack_webhook_token_2026}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=false

# Logging
logging.level.com.fintrack=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
